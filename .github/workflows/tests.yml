name: Speech API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "from piper import PiperVoice; import onnxruntime"
      - run: python -m unittest -v test_server.py
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --vulnerability-service pypi --progress-spinner=off
